apiVersion: v1
kind: Secret
metadata:
  name: slate-mcp-secrets
  namespace: slate-mcp
type: Opaque
stringData:
  Secrets__CanonicalDeviceToken: replace-with-a-dedicated-read-write-device-token
  Secrets__ProposalSigningKey: replace-with-at-least-32-random-bytes
  Mcp__ExpectedLibraryId: replace-with-canonical-library-uuid
  # Orbit Identity (orbit-cloud/deploy/identity). Both values are the issuer, with its trailing slash.
  OAuth__Authority: https://auth.karthiksurkanti.in/
  OAuth__AuthorizationServers__0: https://auth.karthiksurkanti.in/
  # Orbit Identity's Identity__OwnerSubject.
  OAuth__AllowedSubjectIds__0: replace-with-the-orbit-identity-owner-subject

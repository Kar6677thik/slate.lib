apiVersion: v1
kind: Secret
metadata:
  name: slate-mcp-secrets
  namespace: slate-mcp
type: Opaque
stringData:
  Secrets__CanonicalDeviceToken: replace-with-a-dedicated-read-write-device-token
  Secrets__ProposalSigningKey: replace-with-at-least-32-random-bytes
  Mcp__ExpectedLibraryId: replace-with-canonical-library-uuid
  OAuth__Authority: https://your-authorization-server.example.com
  OAuth__AuthorizationServers__0: https://your-authorization-server.example.com
  OAuth__AllowedCallerIds__0: replace-with-chatgpt-oauth-client-id-if-pre-registered

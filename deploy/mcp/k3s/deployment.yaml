apiVersion: apps/v1
kind: Deployment
metadata:
  name: slate-mcp
  namespace: slate-mcp
  labels:
    app.kubernetes.io/name: slate-mcp
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slate-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slate-mcp
        app.kubernetes.io/component: mcp-server
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: slate-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/kar6677thik/slate.lib-mcp:replace-me
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: slate-mcp-config
            - secretRef:
                name: slate-mcp-secrets
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: slate-mcp.slate-mcp.svc.cluster.local
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: slate-mcp.slate-mcp.svc.cluster.local
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: slate-mcp
  namespace: slate-mcp
  labels:
    app.kubernetes.io/name: slate-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: slate-mcp
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http

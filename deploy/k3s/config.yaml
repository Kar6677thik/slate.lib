apiVersion: v1
kind: ConfigMap
metadata:
  name: slate-config
  namespace: slate
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  # Megatron's k3s pod CIDR: permits Tailscale Serve's node-local proxy hop to assert HTTPS.
  # Keep this scoped to the actual cluster network; never use unrestricted forwarded-header trust.
  Networking__TrustedProxyNetworks: 10.42.0.0/24
  Library__RootPath: /data/library
  Data__AssetsPath: /data/assets
  Data__DerivedPath: /derived
  Authentication__DeviceFile: /data/auth/devices.json
  Git__StatePath: /data/state/git
  Updates__ManifestPath: /data/releases/release-manifest.json
  Updates__ArtifactRoot: /data/releases
  Backup__StatusFile: /data/state/backup-status.json
  Git__RemoteName: origin
  Git__Branch: main
  Git__AuthorName: Slate
  Git__AuthorEmail: slate@localhost

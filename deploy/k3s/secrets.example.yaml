# Copy the commands in docs/OPERATIONS.md. Never apply this example with real values committed.
apiVersion: v1
kind: Secret
metadata:
  name: slate-backup
  namespace: slate
type: Opaque
stringData:
  RESTIC_REPOSITORY: s3:https://s3.example.invalid/slate
  RESTIC_PASSWORD: replace-outside-git
  AWS_ACCESS_KEY_ID: replace-outside-git
  AWS_SECRET_ACCESS_KEY: replace-outside-git
---
apiVersion: v1
kind: Secret
metadata:
  name: slate-git-ssh
  namespace: slate
type: Opaque
stringData:
  id_ed25519: replace-outside-git
  known_hosts: github.com ssh-ed25519 replace-with-verified-host-key

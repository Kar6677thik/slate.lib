apiVersion: v1
kind: PersistentVolume
metadata:
  name: slate-data
spec:
  capacity:
    storage: 50Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: slate-local
  hostPath:
    path: /srv/slate/data
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slate-data
  namespace: slate
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: slate-local
  volumeName: slate-data
  resources:
    requests:
      storage: 50Gi

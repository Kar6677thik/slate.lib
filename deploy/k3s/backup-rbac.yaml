apiVersion: v1
kind: ServiceAccount
metadata:
  name: slate-backup
  namespace: slate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: slate-backup
  namespace: slate
rules:
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    resourceNames: [slate]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: slate-backup
  namespace: slate
subjects:
  - kind: ServiceAccount
    name: slate-backup
    namespace: slate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: slate-backup

apiVersion: v1
kind: Namespace
metadata:
  name: slate-web
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: slate-web-config
  namespace: slate-web
data:
  SLATE_ALLOWED_SERVERS: "https://megatron.tailf67d61.ts.net,https://lib.karthiksurkanti.in"
  SLATE_UPSTREAM_URL: "http://slate.slate.svc.cluster.local:8080"
  SLATE_PUBLIC_ORIGIN: "https://lib.karthiksurkanti.in"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slate-web
  namespace: slate-web
  labels:
    app.kubernetes.io/name: slate-web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slate-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slate-web
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: slate-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: slate-web
          image: ghcr.io/kar6677thik/slate.lib-web:replace-me
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: slate-web-config
            - secretRef:
                name: slate-web-intelligence
                optional: true
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            # Prometheus metrics for in-cluster scraping only; deliberately not published by the Service.
            - name: metrics
              containerPort: 9464
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /manifest.webmanifest
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          # Liveness uses an I/O-free route and tolerates about a minute of stall, so one slow request can't get the
          # pod killed; a genuinely hung process still restarts.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: slate-web
  namespace: slate-web
  labels:
    app.kubernetes.io/name: slate-web
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: slate-web
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: http
      nodePort: 30519
---
# Ingress allowlist for slate-web. Egress stays open: the app calls the Slate API, PostgreSQL and the AI provider.
# Policies see post-kube-proxy addresses, so node-originated traffic (tailscale serve, NodePort, kubelet probes, a
# node-level cloudflared) arrives from the node's cni0 address, 10.42.0.1 on k3s. kube-router also always accepts
# traffic from the pod's own node; what this removes is reachability from every other pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: slate-web
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: slate-web
  namespace: slate-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: slate-web
  policyTypes: ["Ingress"]
  ingress:
    # The node: tailscale serve, the NodePort, kubelet probes.
    - from:
        - ipBlock:
            cidr: 10.42.0.1/32
      ports:
        - protocol: TCP
          port: 3000
    # The in-cluster Cloudflare tunnel, which serves the public web origin.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare
      ports:
        - protocol: TCP
          port: 3000
    # Slate MCP reuses the intelligence API.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: slate-mcp
          podSelector:
            matchLabels:
              app.kubernetes.io/name: slate-mcp
      ports:
        - protocol: TCP
          port: 3000
    # VictoriaMetrics scrapes /metrics; nothing else may reach that port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: victoria-metrics
      ports:
        - protocol: TCP
          port: 9464
